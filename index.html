window.addEventListener("deviceorientation", (event) => {
  const alpha = event.alpha;
  if (alpha === null) return;
  let direction = "북";

  if (alpha >= 45 && alpha < 135) direction = "동";
  else if (alpha >= 135 && alpha < 225) direction = "남";
  else if (alpha >= 225 && alpha < 315) direction = "서";
